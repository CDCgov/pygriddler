version: 2

multi-ecosystem-groups:
  infrastructure:
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
      include: "scope"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "infrastructure"

  - package-ecosystem: "pre-commit"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "infrastructure"
